name: tests

# Runs the existing tests/ suite on every push and PR. Previously the repo
# had a tests/ folder with real tests (pressure->depth conversion, the
# global predict-point domain fix, land rejection) but nothing wired them
# into CI, so a regression in any of that could sit unnoticed. This
# workflow is the fix: it fails the build if any of those tests fail.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system deps for lightgbm
        run: sudo apt-get update && sudo apt-get install -y libgomp1

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run test suite
        run: pytest tests/ -v
